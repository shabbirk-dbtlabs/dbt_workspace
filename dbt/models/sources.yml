version: 2

sources:
  - name: snowflake_account_usage
    description: >
      Snowflake's ACCOUNT_USAGE schema contains views that provide usage and metadata 
      information about your Snowflake account. This data is used to monitor 
      warehouse performance, costs, and system usage patterns.
    database: snowflake
    schema: account_usage
    tables:
      - name: warehouse_metering_history
        description: >
          Historical warehouse usage data including credit consumption and compute time.
          Data is retained for 1 year and is delayed by up to 45 minutes.
        columns:
          - name: start_time
            description: Start time of the warehouse usage period
            tests:
              - not_null
          - name: end_time
            description: End time of the warehouse usage period
            tests:
              - not_null
          - name: warehouse_id
            description: Internal warehouse identifier
          - name: warehouse_name
            description: Name of the warehouse
          - name: credits_used
            description: Total credits consumed during the time period
          - name: credits_used_compute
            description: Credits used for compute workloads
          - name: credits_used_cloud_services
            description: Credits used for cloud services
            
      - name: pipes
        description: >
          Information about all pipes in the account including metadata and configuration.
          Provides a snapshot view of pipe definitions.
        columns:
          - name: pipe_id
            description: Internal pipe identifier
            tests:
              - not_null
              - unique
          - name: pipe_name
            description: Name of the pipe
          - name: pipe_schema_id
            description: Internal schema identifier where pipe exists
          - name: pipe_schema
            description: Schema name where pipe exists
          - name: pipe_catalog_id
            description: Internal database identifier where pipe exists
          - name: pipe_catalog
            description: Database name where pipe exists
          - name: is_autoingest_enabled
            description: Whether auto-ingest is enabled for this pipe
          - name: notification_channel_name
            description: Name of the notification channel used by the pipe
          - name: pipe_owner
            description: Owner of the pipe
          - name: definition
            description: SQL definition of the pipe
          - name: created
            description: Timestamp when pipe was created
          - name: last_altered
            description: Timestamp when pipe was last modified
          - name: comment
            description: Comment/description for the pipe
          - name: deleted
            description: Timestamp when pipe was deleted (null if not deleted)
            
      - name: pipe_usage_history
        description: >
          Historical usage data for Snowpipe including files processed and credits consumed.
          Data is retained for 1 year and is delayed by up to 45 minutes.
        columns:
          - name: pipe_id
            description: Internal pipe identifier
            tests:
              - not_null
          - name: pipe_name
            description: Name of the pipe
          - name: start_time
            description: Start time of the usage period
            tests:
              - not_null
          - name: end_time
            description: End time of the usage period
            tests:
              - not_null
          - name: credits_used
            description: Credits consumed during the time period
          - name: bytes_inserted
            description: Number of bytes inserted via the pipe
          - name: files_inserted
            description: Number of files processed by the pipe
            
      - name: query_history
        description: >
          Historical query execution data including performance metrics and resource usage.
          Data is retained for 1 year and is delayed by up to 45 minutes.
        columns:
          - name: query_id
            description: Unique identifier for the query
            tests:
              - not_null
              - unique
          - name: query_text
            description: Text of the SQL query executed
          - name: database_id
            description: Internal database identifier used by the query
          - name: database_name
            description: Database name used by the query
          - name: schema_id
            description: Internal schema identifier used by the query
          - name: schema_name
            description: Schema name used by the query
          - name: query_type
            description: Type of query (SELECT, INSERT, UPDATE, etc.)
          - name: session_id
            description: Session identifier for the query
          - name: user_name
            description: User who executed the query
          - name: role_name
            description: Role used to execute the query
          - name: warehouse_id
            description: Internal warehouse identifier used by the query
          - name: warehouse_name
            description: Warehouse name used by the query
          - name: warehouse_size
            description: Size of the warehouse (XSMALL, SMALL, etc.)
          - name: warehouse_type
            description: Type of warehouse (STANDARD, etc.)
          - name: cluster_number
            description: Cluster number (for multi-cluster warehouses)
          - name: query_tag
            description: Query tag if specified
          - name: execution_status
            description: Final execution status (SUCCESS, FAILED, etc.)
          - name: error_code
            description: Error code if query failed
          - name: error_message
            description: Error message if query failed
          - name: start_time
            description: Query start timestamp
            tests:
              - not_null
          - name: end_time
            description: Query end timestamp
          - name: total_elapsed_time
            description: Total elapsed time in milliseconds
          - name: bytes_scanned
            description: Number of bytes scanned by the query
          - name: percentage_scanned_from_cache
            description: Percentage of data scanned from cache
          - name: bytes_written
            description: Number of bytes written by the query
          - name: bytes_written_to_result
            description: Number of bytes written to result set
          - name: bytes_read_from_result
            description: Number of bytes read from result set
          - name: rows_produced
            description: Number of rows produced by the query
          - name: rows_inserted
            description: Number of rows inserted by the query
          - name: rows_updated
            description: Number of rows updated by the query
          - name: rows_deleted
            description: Number of rows deleted by the query
          - name: rows_unloaded
            description: Number of rows unloaded by the query
          - name: bytes_deleted
            description: Number of bytes deleted by the query
          - name: partitions_scanned
            description: Number of partitions scanned
          - name: partitions_total
            description: Total number of partitions available
          - name: bytes_spilled_to_local_storage
            description: Bytes spilled to local storage
          - name: bytes_spilled_to_remote_storage
            description: Bytes spilled to remote storage
          - name: bytes_sent_over_the_network
            description: Bytes sent over the network
          - name: compilation_time
            description: Time spent compiling the query in milliseconds
          - name: execution_time
            description: Time spent executing the query in milliseconds
          - name: queued_provisioning_time
            description: Time spent queued for provisioning in milliseconds
          - name: queued_repair_time
            description: Time spent queued for repair in milliseconds
          - name: queued_overload_time
            description: Time spent queued due to overload in milliseconds
          - name: transaction_blocked_time
            description: Time blocked by transactions in milliseconds
          - name: outbound_data_transfer_cloud
            description: Outbound data transfer cloud
          - name: outbound_data_transfer_region
            description: Outbound data transfer region
          - name: outbound_data_transfer_bytes
            description: Bytes transferred outbound
          - name: inbound_data_transfer_cloud
            description: Inbound data transfer cloud
          - name: inbound_data_transfer_region
            description: Inbound data transfer region
          - name: inbound_data_transfer_bytes
            description: Bytes transferred inbound
          - name: list_external_files_time
            description: Time spent listing external files in milliseconds
          - name: credits_used_cloud_services
            description: Credits used for cloud services
            
      - name: task_versions
        description: >
          Information about task definitions including their current state and metadata.
          Provides versioning information for tasks.
        columns:
          - name: root_task_id
            description: ID of the root task in the task graph
          - name: graph_version
            description: Version number of the task graph
          - name: graph_version_created_on
            description: Timestamp when this version was created
            tests:
              - not_null
          - name: name
            description: Name of the task
          - name: id
            description: Internal task identifier
            tests:
              - not_null
          - name: database_id
            description: Internal database identifier where task exists
          - name: database_name
            description: Database name where task exists
          - name: schema_id
            description: Internal schema identifier where task exists
          - name: schema_name
            description: Schema name where task exists
          - name: owner
            description: Owner of the task
          - name: comment
            description: Comment/description for the task
          - name: warehouse_name
            description: Warehouse used by the task
          - name: schedule
            description: Schedule definition for the task
          - name: predecessors
            description: JSON array of predecessor task IDs
          - name: state
            description: Current state of the task (STARTED, SUSPENDED, etc.)
          - name: definition
            description: SQL definition of the task
          - name: condition_text
            description: Condition text that determines if task should run
          - name: allow_overlapping_execution
            description: Whether overlapping execution is allowed
          - name: error_integration
            description: Error integration configuration
          - name: last_committed_on
            description: Timestamp when task was last committed
          - name: last_suspended_on
            description: Timestamp when task was last suspended
            
      - name: task_history
        description: >
          Historical execution data for tasks including run status and performance metrics.
          Data is retained for 1 year and is delayed by up to 45 minutes.
        columns:
          - name: name
            description: Name of the task
          - name: query_text
            description: SQL text executed by the task
          - name: condition_text
            description: Condition that triggered the task execution
          - name: schema_name
            description: Schema name where task exists
          - name: task_schema_id
            description: Internal schema identifier where task exists
          - name: database_name
            description: Database name where task exists
          - name: task_database_id
            description: Internal database identifier where task exists
          - name: scheduled_time
            description: Time when task was scheduled to run
            tests:
              - not_null
          - name: completed_time
            description: Time when task execution completed
          - name: state
            description: Execution state (SUCCEEDED, FAILED, etc.)
          - name: return_value
            description: Return value from the task execution
          - name: query_id
            description: Query ID of the SQL executed by the task
          - name: query_start_time
            description: Start time of the query execution
          - name: error_code
            description: Error code if task failed
          - name: error_message
            description: Error message if task failed
          - name: graph_version
            description: Version of the task graph when executed
          - name: run_id
            description: Unique identifier for this task run
          - name: root_task_id
            description: ID of the root task in the task graph
          - name: scheduled_from
            description: How the task was scheduled (CRON, etc.)


