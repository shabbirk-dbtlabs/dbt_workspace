version: 2

models:
  - name: mart_warehouse_metering_history
    description: >
      Historical warehouse usage data including credit consumption and compute time.
      This mart provides a clean view of warehouse performance metrics for cost monitoring
      and optimization analysis.
    columns:
      - name: start_time
        description: Start time of the warehouse usage period
        tests:
          - not_null
      - name: end_time
        description: End time of the warehouse usage period
        tests:
          - not_null
      - name: warehouse_id
        description: Internal warehouse identifier
      - name: warehouse_name
        description: Name of the warehouse
        tests:
          - not_null
      - name: credits_used
        description: Total credits consumed during the time period
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: credits_used_compute
        description: Credits used for compute workloads
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: credits_used_cloud_services
        description: Credits used for cloud services
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ingestion_time
        description: Timestamp when the record was ingested into our data warehouse
        tests:
          - not_null

  - name: mart_snowpipes
    description: >
      Information about all Snowpipes in the account with latest record indicators.
      Includes metadata, configuration, and current state information.
    columns:
      - name: pipe_id
        description: Internal pipe identifier
        tests:
          - not_null
          - unique
      - name: pipe_name
        description: Name of the pipe
        tests:
          - not_null
      - name: is_latest
        description: Flag indicating if this is the most recent version of the pipe record
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: mart_snowpipe_usage_history
    description: >
      Historical usage data for Snowpipe including files processed and credits consumed.
      Used for monitoring Snowpipe performance and cost analysis.
    columns:
      - name: pipe_id
        description: Internal pipe identifier
        tests:
          - not_null
      - name: start_time
        description: Start time of the usage period
        tests:
          - not_null
      - name: end_time
        description: End time of the usage period
        tests:
          - not_null
      - name: credits_used
        description: Credits consumed during the time period
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: mart_query_history
    description: >
      Historical query execution data including performance metrics and resource usage.
      Essential for query performance monitoring, cost optimization, and usage analysis.
    columns:
      - name: query_id
        description: Unique identifier for the query
        tests:
          - not_null
          - unique
      - name: start_time
        description: Query start timestamp
        tests:
          - not_null
      - name: execution_status
        description: Final execution status (SUCCESS, FAILED, etc.)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SUCCESS', 'FAIL', 'INCIDENT', 'ABORTED']
      - name: user_name
        description: User who executed the query
        tests:
          - not_null
      - name: warehouse_name
        description: Warehouse name used by the query

  - name: mart_tasks
    description: >
      Information about task definitions including their current state and metadata.
      Provides versioning information and latest record indicators for tasks.
    columns:
      - name: id
        description: Internal task identifier
        tests:
          - not_null
      - name: name
        description: Name of the task
        tests:
          - not_null
      - name: state
        description: Current state of the task (STARTED, SUSPENDED, etc.)
        tests:
          - accepted_values:
              arguments:
                values: ['STARTED', 'SUSPENDED']
      - name: is_latest
        description: Flag indicating if this is the most recent version of the task record
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: mart_task_usage_history
    description: >
      Historical execution data for tasks including run status and performance metrics.
      Used for monitoring task performance and troubleshooting execution issues.
    columns:
      - name: scheduled_time
        description: Time when task was scheduled to run
        tests:
          - not_null
      - name: state
        description: Execution state (SUCCEEDED, FAILED, etc.)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SUCCEEDED', 'FAILED', 'CANCELLED', 'SKIPPED']
      - name: run_id
        description: Unique identifier for this task run

  - name: mart_snowflake_cost
    description: >
      Daily cost calculations based on warehouse credit consumption.
      Uses a rate of $3.00 per credit for cost analysis and budgeting.
    columns:
      - name: start_date
        description: Date of the cost calculation
        tests:
          - not_null
          - unique
      - name: total_credits_used
        description: Total credits consumed on this date
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: cost
        description: Calculated cost in USD (credits * $3.00)
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
